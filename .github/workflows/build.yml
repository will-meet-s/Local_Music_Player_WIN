name: build
on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: ['feature/**', 'main']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WinMusicPlayer.sln -p:Platform=x64
      - run: dotnet build WinMusicPlayer.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test tests/MusicCore.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: 失败用例写成 annotations（公开可读）
        if: failure()
        shell: pwsh
        run: |
          function Esc([string]$s) { ($s -replace '%','%25' -replace "`r",'' -replace "`n",'%0A') }
          function EscProp([string]$s) { (Esc $s) -replace ':','%3A' -replace ',','%2C' }
          $trx = Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Output "::error title=没有生成 TRX::dotnet test 在运行用例之前就失败了（编译或发现阶段）"; exit 0 }
          [xml]$x = Get-Content $trx.FullName -Raw
          $failed = @($x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
          Write-Output "::error title=失败用例数::$($failed.Count) 条（下面最多列出 9 条）"
          foreach ($r in ($failed | Select-Object -First 9)) {
            $msg = "$($r.Output.ErrorInfo.Message)`n$((($r.Output.ErrorInfo.StackTrace) -split "`n" | Select-Object -First 4) -join "`n")"
            if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
            Write-Output "::error title=$(EscProp $r.testName)::$(Esc $msg)"
          }

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/WinMusicPlayer -p:PublishProfile=win-x64
      - run: dotnet publish src/WinMusicPlayer -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/win-x64-folder
      - uses: actions/upload-artifact@v4
        with:
          name: WinMusicPlayer-win-x64-folder
          path: publish/win-x64-folder/
          retention-days: 14
      - name: 检查单文件发布目录只有一个 exe（FR-012 ①）
        shell: pwsh
        run: |
          $root  = (Resolve-Path publish/win-x64).Path
          $files = @(Get-ChildItem $root -Recurse -File)
          $list  = ($files | ForEach-Object { "{0} ({1} bytes)" -f $_.FullName.Substring($root.Length + 1), $_.Length }) -join ' | '
          $files | ForEach-Object { "{0,12}  {1}" -f $_.Length, $_.FullName }
          Write-Output "::notice title=单文件发布目录（共 $($files.Count) 个文件）::$list"
          if ($files.Count -ne 1 -or $files[0].Name -ne 'WinMusicPlayer.exe') {
            throw "单文件发布目录里有 $($files.Count) 个文件，不是只有一个 WinMusicPlayer.exe"
          }
      - name: 生成本包包含清单
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/manifest | Out-Null
          $lines = @("提交：$(git rev-parse HEAD)", "构建时间（UTC）：$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))", "", "包含的提交（7775f6f 之后）：")
          $lines += git log --oneline 7775f6f..HEAD
          $lines | Set-Content -Encoding utf8 publish/manifest/本包包含.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WinMusicPlayer-win-x64-single
          path: |
            publish/win-x64/
            publish/manifest/
          retention-days: 14
